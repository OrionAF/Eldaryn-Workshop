name: Deploy to GitHub Pages

# Manual only (2026-10-14): the build bundles the extracted game catalogues (src/data/game),
# which must not be published. The app runs locally for now. Don't re-enable the push trigger
# (or run this) without the user's say-so.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # No `npm test` here: deploys are manual, from a main that was tested locally; the suite
      # takes ~9 min on a 2-core runner. The build still catches a broken bundle.
      - run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
